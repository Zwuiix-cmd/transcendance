services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/transcendance.db}
      SCHEMA_PATH: /app/schema.sql
      SESSION_TTL: ${SESSION_TTL:-PT24H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CDN_URL: ${CDN_URL:-http://cdn:8091}
      CDN_PUBLIC_URL: ${CDN_PUBLIC_URL:-/files}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_CDN_API_KEY: ${INTERNAL_CDN_API_KEY:-replace-with-a-long-random-cdn-key}
      GAME_SERVICE_KEY: ${GAME_SERVICE_KEY:-replace-with-a-long-random-game-service-key}
      DEBUG_AUTH_ENABLED: ${DEBUG_AUTH_ENABLED:-false}
      DEBUG_AUTH_USERNAME: ${DEBUG_AUTH_USERNAME:-Zwuiix}
      OTEL_TRACES_STDOUT: ${OTEL_TRACES_STDOUT:-false}
    volumes:
      - sqlite_data:/app/data
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    expose:
      - "8080"
    depends_on:
      cdn:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  cdn:
    build:
      context: .
      dockerfile: apps/cdn/Dockerfile
    environment:
      INTERNAL_API_KEY: ${INTERNAL_CDN_API_KEY:-replace-with-a-long-random-cdn-key}
      PORT: 8091
      STORAGE_DIR: /data/files
      STATIC_ASSETS_DIR: /data/files/uno
      PUBLIC_BASE_URL: ${CDN_PUBLIC_URL:-/files}
    volumes:
      - cdn_data:/data
      - ./apps/cdn/assets/uno:/data/files/uno:ro
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: ./apps/admin
    environment:
      ADMIN_API_URL: http://api:8080/api/v1
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      PORT: 8081
    expose:
      - "8081"
    depends_on:
      api:
        condition: service_healthy

  db-cli:
    image: alpine:3.22
    profiles: ["tools"]
    volumes:
      - sqlite_data:/data

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DEBUG_AUTH: ${VITE_DEBUG_AUTH:-false}
        VITE_ASSET_BASE_URL: ${VITE_ASSET_BASE_URL:-/}
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    depends_on:
      api:
        condition: service_healthy
      cdn:
        condition: service_healthy
      admin:
        condition: service_started
    ports:
      - "${HTTP_PORT:-1080}:1080"
      - "${HTTPS_PORT:-1443}:1443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  sqlite_data:
  cdn_data:
  caddy_data:
  caddy_config:
